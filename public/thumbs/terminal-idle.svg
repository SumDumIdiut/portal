<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a00"/>
      <stop offset="100%" stop-color="#1a1500"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f4a"/>
      <stop offset="100%" stop-color="#ffcc44"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b09ffc"/>
      <stop offset="100%" stop-color="#f87cc4"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ef5a8"/>
      <stop offset="100%" stop-color="#42c8ff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- Coins / gold display -->
  <text x="40" y="38" font-family="monospace" font-size="11" fill="rgba(255,220,80,.6)">Gold</text>
  <text x="160" y="38" font-family="monospace" font-size="14" font-weight="700" fill="#ffcc44">1,247,830</text>
  <!-- Progress bars -->
  <text x="40" y="62" font-family="monospace" font-size="10" fill="rgba(255,159,74,.6)">Mine</text>
  <rect x="90" y="52" width="200" height="12" rx="6" fill="rgba(255,255,255,.07)"/>
  <rect x="90" y="52" width="160" height="12" rx="6" fill="url(#bar1)"/>
  <text x="296" y="63" font-family="monospace" font-size="9" fill="rgba(255,255,255,.4)">80%</text>

  <text x="40" y="88" font-family="monospace" font-size="10" fill="rgba(176,159,252,.6)">Magic</text>
  <rect x="90" y="78" width="200" height="12" rx="6" fill="rgba(255,255,255,.07)"/>
  <rect x="90" y="78" width="110" height="12" rx="6" fill="url(#bar2)"/>
  <text x="296" y="89" font-family="monospace" font-size="9" fill="rgba(255,255,255,.4)">55%</text>

  <text x="40" y="114" font-family="monospace" font-size="10" fill="rgba(62,245,168,.6)">Craft</text>
  <rect x="90" y="104" width="200" height="12" rx="6" fill="rgba(255,255,255,.07)"/>
  <rect x="90" y="104" width="70" height="12" rx="6" fill="url(#bar3)"/>
  <text x="296" y="115" font-family="monospace" font-size="9" fill="rgba(255,255,255,.4)">35%</text>

  <!-- Prestige badge -->
  <rect x="40" y="126" width="80" height="18" rx="9" fill="rgba(255,220,80,.15)" stroke="rgba(255,220,80,.3)" stroke-width="1"/>
  <text x="80" y="139" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,220,80,.8)">★ Prestige 3</text>
  <text x="160" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">TERMINAL IDLE</text>
</svg>
