<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0f00"/>
      <stop offset="100%" stop-color="#2a1800"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- Stopwatch outline -->
  <circle cx="160" cy="88" r="58" fill="none" stroke="rgba(255,159,74,.2)" stroke-width="2"/>
  <circle cx="160" cy="88" r="52" fill="rgba(255,159,74,.06)" stroke="rgba(255,159,74,.3)" stroke-width="1.5"/>
  <!-- Timer marks -->
  <line x1="160" y1="38" x2="160" y2="46" stroke="rgba(255,159,74,.6)" stroke-width="2.5"/>
  <line x1="208" y1="52" x2="204" y2="59" stroke="rgba(255,159,74,.3)" stroke-width="1.5"/>
  <line x1="212" y1="88" x2="204" y2="88" stroke="rgba(255,159,74,.3)" stroke-width="1.5"/>
  <line x1="112" y1="88" x2="120" y2="88" stroke="rgba(255,159,74,.3)" stroke-width="1.5"/>
  <line x1="116" y1="52" x2="120" y2="59" stroke="rgba(255,159,74,.3)" stroke-width="1.5"/>
  <!-- Clock hands -->
  <line x1="160" y1="88" x2="160" y2="52" stroke="#ff9f4a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="160" y1="88" x2="188" y2="74" stroke="rgba(255,159,74,.7)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="160" cy="88" r="4" fill="#ff9f4a"/>
  <!-- Top button -->
  <rect x="150" y="28" width="20" height="8" rx="4" fill="rgba(255,159,74,.4)" stroke="rgba(255,159,74,.5)" stroke-width="1"/>
  <!-- Time display -->
  <text x="160" y="105" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#ff9f4a">214ms</text>
  <!-- Lightning bolts -->
  <text x="82" y="95" font-family="sans-serif" font-size="22" fill="rgba(255,220,80,.5)">⚡</text>
  <text x="222" y="95" font-family="sans-serif" font-size="22" fill="rgba(255,220,80,.5)">⚡</text>
  <text x="160" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">HUMAN BENCHMARK</text>
</svg>
