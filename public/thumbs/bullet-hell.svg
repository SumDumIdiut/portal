<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0015"/>
      <stop offset="100%" stop-color="#1a003a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- Stars -->
  <circle cx="30" cy="20" r="1" fill="white" opacity=".6"/>
  <circle cx="80" cy="45" r="1" fill="white" opacity=".4"/>
  <circle cx="200" cy="15" r="1.5" fill="white" opacity=".5"/>
  <circle cx="270" cy="50" r="1" fill="white" opacity=".6"/>
  <circle cx="50" cy="130" r="1" fill="white" opacity=".3"/>
  <circle cx="290" cy="100" r="1" fill="white" opacity=".5"/>
  <circle cx="140" cy="140" r="1" fill="white" opacity=".4"/>
  <!-- Player ship -->
  <polygon points="160,115 140,140 180,140" fill="rgba(66,200,255,.9)" stroke="rgba(66,200,255,.5)" stroke-width="1"/>
  <polygon points="160,108 153,125 167,125" fill="white" opacity=".9"/>
  <!-- Engine fire -->
  <ellipse cx="160" cy="143" rx="6" ry="10" fill="rgba(255,159,74,.7)"/>
  <ellipse cx="160" cy="143" rx="3" ry="6" fill="rgba(255,220,80,.8)"/>
  <!-- Enemy bullets (red) -->
  <circle cx="80" cy="60" r="5" fill="rgba(255,107,129,.9)"/>
  <circle cx="120" cy="40" r="5" fill="rgba(255,107,129,.8)"/>
  <circle cx="200" cy="50" r="5" fill="rgba(255,107,129,.9)"/>
  <circle cx="240" cy="35" r="5" fill="rgba(255,107,129,.7)"/>
  <circle cx="100" cy="90" r="5" fill="rgba(255,107,129,.8)"/>
  <circle cx="220" cy="85" r="5" fill="rgba(255,107,129,.9)"/>
  <circle cx="60" cy="110" r="5" fill="rgba(255,107,129,.6)"/>
  <circle cx="260" cy="105" r="5" fill="rgba(255,107,129,.7)"/>
  <!-- Player bullet (blue) -->
  <rect x="157" y="70" width="6" height="16" rx="3" fill="rgba(66,200,255,.9)"/>
  <!-- Enemy ships -->
  <polygon points="80,30 65,55 95,55" fill="rgba(255,107,129,.6)" stroke="rgba(255,107,129,.3)" stroke-width="1"/>
  <polygon points="240,20 225,45 255,45" fill="rgba(255,107,129,.6)" stroke="rgba(255,107,129,.3)" stroke-width="1"/>
  <text x="160" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">BULLET HELL</text>
</svg>
