<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f2a"/>
      <stop offset="100%" stop-color="#1a0a3a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- Neural network connections -->
  <!-- Layer 1 → 2 -->
  <line x1="75" y1="50" x2="160" y2="40" stroke="rgba(176,159,252,.2)" stroke-width="1"/>
  <line x1="75" y1="50" x2="160" y2="80" stroke="rgba(176,159,252,.15)" stroke-width="1"/>
  <line x1="75" y1="80" x2="160" y2="40" stroke="rgba(176,159,252,.15)" stroke-width="1"/>
  <line x1="75" y1="80" x2="160" y2="80" stroke="rgba(176,159,252,.2)" stroke-width="1"/>
  <line x1="75" y1="80" x2="160" y2="120" stroke="rgba(176,159,252,.15)" stroke-width="1"/>
  <line x1="75" y1="110" x2="160" y2="80" stroke="rgba(176,159,252,.15)" stroke-width="1"/>
  <line x1="75" y1="110" x2="160" y2="120" stroke="rgba(176,159,252,.2)" stroke-width="1"/>
  <!-- Layer 2 → 3 -->
  <line x1="160" y1="40" x2="245" y2="60" stroke="rgba(66,200,255,.2)" stroke-width="1"/>
  <line x1="160" y1="80" x2="245" y2="60" stroke="rgba(66,200,255,.2)" stroke-width="1"/>
  <line x1="160" y1="80" x2="245" y2="100" stroke="rgba(66,200,255,.2)" stroke-width="1"/>
  <line x1="160" y1="120" x2="245" y2="100" stroke="rgba(66,200,255,.2)" stroke-width="1"/>
  <!-- Layer 1 nodes -->
  <circle cx="75" cy="50" r="8" fill="rgba(176,159,252,.7)" stroke="rgba(176,159,252,.3)" stroke-width="1"/>
  <circle cx="75" cy="80" r="8" fill="rgba(176,159,252,.9)" stroke="rgba(176,159,252,.5)" stroke-width="1"/>
  <circle cx="75" cy="110" r="8" fill="rgba(176,159,252,.7)" stroke="rgba(176,159,252,.3)" stroke-width="1"/>
  <!-- Layer 2 nodes -->
  <circle cx="160" cy="40" r="9" fill="rgba(248,124,196,.7)" stroke="rgba(248,124,196,.3)" stroke-width="1"/>
  <circle cx="160" cy="80" r="9" fill="rgba(248,124,196,.9)" stroke="rgba(248,124,196,.5)" stroke-width="1.5"/>
  <circle cx="160" cy="120" r="9" fill="rgba(248,124,196,.7)" stroke="rgba(248,124,196,.3)" stroke-width="1"/>
  <!-- Layer 3 nodes -->
  <circle cx="245" cy="60" r="8" fill="rgba(66,200,255,.8)" stroke="rgba(66,200,255,.4)" stroke-width="1"/>
  <circle cx="245" cy="100" r="8" fill="rgba(66,200,255,.8)" stroke="rgba(66,200,255,.4)" stroke-width="1"/>
  <!-- Labels -->
  <text x="75" y="128" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(176,159,252,.5)">IN</text>
  <text x="245" y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(66,200,255,.5)">OUT</text>
  <text x="160" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">LLM ROUTER</text>
</svg>
