<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c3f9e"/>
      <stop offset="100%" stop-color="#7c6cf8"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- Clock face -->
  <circle cx="100" cy="80" r="48" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
  <circle cx="100" cy="80" r="44" fill="rgba(255,255,255,.07)"/>
  <line x1="100" y1="80" x2="100" y2="46" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="80" x2="126" y2="80" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="80" r="4" fill="white"/>
  <!-- Hour marks -->
  <circle cx="100" cy="38" r="2" fill="rgba(255,255,255,.5)"/>
  <circle cx="142" cy="80" r="2" fill="rgba(255,255,255,.5)"/>
  <circle cx="100" cy="122" r="2" fill="rgba(255,255,255,.5)"/>
  <circle cx="58" cy="80" r="2" fill="rgba(255,255,255,.5)"/>
  <!-- Sound waves -->
  <path d="M190 60 Q200 80 190 100" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M205 48 Q222 80 205 112" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M220 38 Q244 80 220 122" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Speaker cone -->
