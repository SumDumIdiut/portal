<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2a1a"/>
      <stop offset="100%" stop-color="#0f4a2a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- House -->
  <polygon points="160,25 240,80 80,80" fill="rgba(255,255,255,.15)" stroke="rgba(62,245,168,.5)" stroke-width="1.5"/>
  <rect x="100" y="80" width="120" height="60" fill="rgba(255,255,255,.08)" stroke="rgba(62,245,168,.3)" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="145" y="100" width="30" height="40" rx="4" fill="rgba(62,245,168,.3)" stroke="rgba(62,245,168,.5)" stroke-width="1"/>
  <!-- Windows -->
  <rect x="108" y="88" width="22" height="22" rx="3" fill="rgba(255,220,80,.25)" stroke="rgba(255,220,80,.4)" stroke-width="1"/>
  <rect x="190" y="88" width="22" height="22" rx="3" fill="rgba(255,220,80,.25)" stroke="rgba(255,220,80,.4)" stroke-width="1"/>
  <!-- Wifi arcs -->
  <path d="M250 55 Q270 55 270 75" fill="none" stroke="rgba(62,245,168,.3)" stroke-width="2" stroke-linecap="round"/>
  <path d="M244 49 Q277 49 277 82" fill="none" stroke="rgba(62,245,168,.2)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="250" cy="58" r="3" fill="rgba(62,245,168,.6)"/>
  <text x="160" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">SMART HOME</text>
</svg>
