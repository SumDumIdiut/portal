<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0800"/>
      <stop offset="100%" stop-color="#1e1200"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- GPU chip -->
  <rect x="85" y="30" width="150" height="100" rx="8" fill="rgba(255,159,74,.08)" stroke="rgba(255,159,74,.3)" stroke-width="1.5"/>
  <!-- Core grid 4x4 -->
  <g fill="rgba(255,159,74,.5)" stroke="rgba(255,159,74,.2)" stroke-width="1">
    <rect x="100" y="45" width="22" height="22" rx="3"/>
    <rect x="128" y="45" width="22" height="22" rx="3"/>
    <rect x="156" y="45" width="22" height="22" rx="3"/>
    <rect x="184" y="45" width="22" height="22" rx="3"/>
    <rect x="100" y="73" width="22" height="22" rx="3"/>
    <rect x="128" y="73" width="22" height="22" rx="3" fill="rgba(255,200,80,.7)"/>
    <rect x="156" y="73" width="22" height="22" rx="3" fill="rgba(255,200,80,.7)"/>
    <rect x="184" y="73" width="22" height="22" rx="3"/>
    <rect x="100" y="101" width="22" height="22" rx="3"/>
    <rect x="128" y="101" width="22" height="22" rx="3"/>
    <rect x="156" y="101" width="22" height="22" rx="3"/>
    <rect x="184" y="101" width="22" height="22" rx="3"/>
  </g>
  <!-- Memory pins top -->
  <g fill="rgba(255,159,74,.4)">
    <rect x="100" y="22" width="6" height="8" rx="2"/>
    <rect x="114" y="22" width="6" height="8" rx="2"/>
    <rect x="128" y="22" width="6" height="8" rx="2"/>
    <rect x="142" y="22" width="6" height="8" rx="2"/>
    <rect x="156" y="22" width="6" height="8" rx="2"/>
    <rect x="170" y="22" width="6" height="8" rx="2"/>
    <rect x="184" y="22" width="6" height="8" rx="2"/>
    <rect x="198" y="22" width="6" height="8" rx="2"/>
    <!-- bottom pins -->
    <rect x="100" y="130" width="6" height="8" rx="2"/>
    <rect x="128" y="130" width="6" height="8" rx="2"/>
    <rect x="156" y="130" width="6" height="8" rx="2"/>
    <rect x="184" y="130" width="6" height="8" rx="2"/>
  </g>
  <!-- CUDA label on chip -->
  <text x="160" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,159,74,.4)" letter-spacing="2">CUDA</text>
  <text x="160" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">CUDA COMPUTE</text>
</svg>
