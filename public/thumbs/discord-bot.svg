<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- Robot head -->
  <rect x="120" y="28" width="80" height="68" rx="16" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="147" cy="55" r="10" fill="rgba(88,101,242,.8)"/>
  <circle cx="173" cy="55" r="10" fill="rgba(88,101,242,.8)"/>
  <circle cx="147" cy="55" r="5" fill="white"/>
  <circle cx="173" cy="55" r="5" fill="white"/>
  <!-- Mouth -->
  <path d="M140 74 Q160 84 180 74" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-linecap="round"/>
  <!-- Antenna -->
  <line x1="160" y1="28" x2="160" y2="14" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
  <circle cx="160" cy="11" r="4" fill="rgba(88,101,242,.9)"/>
  <!-- Chat bubble -->
  <rect x="215" y="50" width="70" height="40" rx="10" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
  <polygon points="215,75 205,85 215,85" fill="rgba(255,255,255,.1)"/>
  <line x1="225" y1="62" x2="277" y2="62" stroke="rgba(255,255,255,.3)" stroke-width="2" stroke-linecap="round"/>
  <line x1="225" y1="72" x2="265" y2="72" stroke="rgba(255,255,255,.2)" stroke-width="2" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="148" y="96" width="24" height="12" rx="4" fill="rgba(255,255,255,.1)"/>
  <!-- Body -->
  <rect x="118" y="108" width="84" height="30" rx="10" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
  <text x="160" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">DISCORD BOT</text>
</svg>
