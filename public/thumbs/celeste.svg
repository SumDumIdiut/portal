<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0520"/>
      <stop offset="100%" stop-color="#2a0a40"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e8f8"/>
      <stop offset="100%" stop-color="#a8b0d0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="40" cy="20" r="1.5" fill="white" opacity=".8"/>
  <circle cx="90" cy="35" r="1" fill="white" opacity=".6"/>
  <circle cx="200" cy="15" r="1.5" fill="white" opacity=".7"/>
  <circle cx="280" cy="40" r="1" fill="white" opacity=".5"/>
  <circle cx="250" cy="22" r="2" fill="white" opacity=".6"/>
  <circle cx="130" cy="28" r="1" fill="white" opacity=".5"/>
  <!-- Mountain -->
  <polygon points="160,18 280,130 40,130" fill="url(#mtn)" opacity=".85"/>
  <polygon points="160,18 230,90 90,90" fill="white" opacity=".6"/>
  <!-- Ground platform -->
  <rect x="0" y="130" width="320" height="30" fill="#3a2a5a"/>
  <!-- Platform ledges -->
  <rect x="200" y="105" width="60" height="8" rx="4" fill="rgba(255,255,255,.3)"/>
  <rect x="80" y="90" width="50" height="8" rx="4" fill="rgba(255,255,255,.3)"/>
  <!-- Character (Madeline) -->
  <rect x="100" y="74" width="10" height="14" rx="3" fill="#e84a6e"/>
  <circle cx="105" cy="70" r="5" fill="#f5c4a0"/>
  <!-- Strawberry -->
  <circle cx="215" cy="98" r="5" fill="#ff4060"/>
  <path d="M213,94 Q215,90 217,94" fill="rgba(62,245,168,.8)" stroke="none"/>
  <text x="160" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">CELESTE</text>
</svg>
