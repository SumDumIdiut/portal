<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#2d4a8a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- Git branch lines -->
  <line x1="100" y1="30" x2="100" y2="130" stroke="rgba(255,255,255,.2)" stroke-width="2"/>
  <path d="M100 55 Q170 55 170 80 L170 130" fill="none" stroke="rgba(66,200,255,.5)" stroke-width="2"/>
  <path d="M100 80 Q220 80 220 55 L220 30" fill="none" stroke="rgba(176,159,252,.5)" stroke-width="2"/>
  <!-- Commit nodes -->
  <circle cx="100" cy="30" r="7" fill="#42c8ff" opacity=".9"/>
  <circle cx="100" cy="55" r="7" fill="white" opacity=".9"/>
  <circle cx="100" cy="80" r="7" fill="white" opacity=".9"/>
  <circle cx="170" cy="80" r="7" fill="#42c8ff" opacity=".8"/>
  <circle cx="170" cy="105" r="7" fill="#42c8ff" opacity=".6"/>
  <circle cx="170" cy="130" r="7" fill="#42c8ff" opacity=".4"/>
  <circle cx="220" cy="55" r="7" fill="#b09ffc" opacity=".9"/>
  <circle cx="220" cy="30" r="7" fill="#b09ffc" opacity=".7"/>
  <circle cx="100" cy="130" r="7" fill="white" opacity=".7"/>
  <!-- Labels -->
  <text x="115" y="34" font-family="monospace" font-size="10" fill="rgba(66,200,255,.8)">main</text>
  <text x="235" y="34" font-family="monospace" font-size="10" fill="rgba(176,159,252,.8)">feat</text>
  <text x="185" y="84" font-family="monospace" font-size="10" fill="rgba(66,200,255,.7)">dev</text>
  <text x="160" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">GIT FORGE</text>
</svg>
