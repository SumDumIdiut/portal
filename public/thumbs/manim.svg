<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#0d1e36"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- Axes -->
  <line x1="40" y1="130" x2="290" y2="130" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
  <line x1="60" y1="20" x2="60" y2="140" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
  <!-- Arrow heads -->
  <polygon points="290,126 300,130 290,134" fill="rgba(255,255,255,.3)"/>
  <polygon points="56,20 60,10 64,20" fill="rgba(255,255,255,.3)"/>
  <!-- Sine wave -->
  <path d="M60,80 C80,80 90,30 110,30 C130,30 140,130 160,130 C180,130 190,30 210,30 C230,30 240,130 260,130 C270,130 280,105 290,80"
    fill="none" stroke="#b09ffc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cosine wave (offset) -->
  <path d="M60,30 C70,30 80,80 100,80 C120,80 130,130 150,130 C170,130 180,30 200,30 C220,30 230,80 250,80 C265,80 278,55 290,30"
    fill="none" stroke="rgba(66,200,255,.5)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,4"/>
  <!-- Pi label -->
  <text x="107" y="148" text-anchor="middle" font-family="serif" font-size="14" fill="rgba(255,255,255,.3)">π</text>
  <text x="207" y="148" text-anchor="middle" font-family="serif" font-size="14" fill="rgba(255,255,255,.3)">2π</text>
  <!-- Formula -->
  <text x="232" y="45" font-family="serif" font-size="13" fill="rgba(176,159,252,.7)" font-style="italic">sin(x)</text>
  <text x="160" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">MANIM</text>
</svg>
