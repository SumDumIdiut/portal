<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10001a"/>
      <stop offset="100%" stop-color="#1e003a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- Target rings -->
  <circle cx="160" cy="78" r="65" fill="none" stroke="rgba(255,107,129,.15)" stroke-width="2"/>
  <circle cx="160" cy="78" r="50" fill="none" stroke="rgba(255,107,129,.2)" stroke-width="2"/>
  <circle cx="160" cy="78" r="35" fill="none" stroke="rgba(255,159,74,.3)" stroke-width="2"/>
  <circle cx="160" cy="78" r="20" fill="none" stroke="rgba(255,220,80,.4)" stroke-width="2"/>
  <circle cx="160" cy="78" r="8" fill="rgba(255,107,129,.8)"/>
  <!-- Arrow -->
  <line x1="220" y1="20" x2="165" y2="73" stroke="rgba(62,245,168,.7)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="165,73 156,60 178,65" fill="rgba(62,245,168,.8)"/>
  <!-- "50" big text -->
  <text x="160" y="94" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="900" fill="rgba(255,255,255,.08)">50</text>
  <!-- Game list -->
  <text x="36" y="130" font-family="monospace" font-size="10" fill="rgba(255,159,74,.6)">SNAKE</text>
  <text x="100" y="130" font-family="monospace" font-size="10" fill="rgba(176,159,252,.6)">SHOOTER</text>
  <text x="200" y="130" font-family="monospace" font-size="10" fill="rgba(62,245,168,.6)">DUNGEON</text>
  <text x="160" y="153" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">POWER OF 50</text>
</svg>
