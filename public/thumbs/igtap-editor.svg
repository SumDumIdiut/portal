<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001820"/>
      <stop offset="100%" stop-color="#002a38"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#g)"/>
  <!-- Map grid -->
  <g stroke="rgba(66,200,255,.15)" stroke-width="1" fill="none">
    <line x1="40" y1="20" x2="40" y2="145"/> <line x1="80" y1="20" x2="80" y2="145"/>
    <line x1="120" y1="20" x2="120" y2="145"/> <line x1="160" y1="20" x2="160" y2="145"/>
    <line x1="200" y1="20" x2="200" y2="145"/> <line x1="240" y1="20" x2="240" y2="145"/>
    <line x1="280" y1="20" x2="280" y2="145"/>
    <line x1="30" y1="30" x2="290" y2="30"/> <line x1="30" y1="70" x2="290" y2="70"/>
    <line x1="30" y1="110" x2="290" y2="110"/>
  </g>
  <!-- Filled tiles -->
  <rect x="41" y="31" width="38" height="38" rx="2" fill="rgba(66,200,255,.2)"/>
  <rect x="121" y="31" width="38" height="38" rx="2" fill="rgba(66,200,255,.15)"/>
  <rect x="161" y="31" width="38" height="38" rx="2" fill="rgba(66,200,255,.25)"/>
  <rect x="81" y="71" width="38" height="38" rx="2" fill="rgba(66,200,255,.2)"/>
  <rect x="161" y="71" width="38" height="38" rx="2" fill="rgba(66,200,255,.15)"/>
  <rect x="201" y="71" width="38" height="38" rx="2" fill="rgba(66,200,255,.2)"/>
  <rect x="41" y="111" width="38" height="28" rx="2" fill="rgba(66,200,255,.15)"/>
  <rect x="241" y="31" width="38" height="78" rx="2" fill="rgba(176,159,252,.15)"/>
  <!-- Spawn point marker -->
  <circle cx="100" cy="50" r="8" fill="none" stroke="rgba(62,245,168,.7)" stroke-width="1.5"/>
  <circle cx="100" cy="50" r="3" fill="rgba(62,245,168,.8)"/>
  <!-- Selected tile cursor -->
  <rect x="201" y="111" width="38" height="28" rx="2" fill="none" stroke="rgba(255,220,80,.7)" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="160" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,.4)" letter-spacing="2">IGTAP MAP EDITOR</text>
</svg>
