<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06060f">
  <title>CodeCade Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%237c6cf8'/><text x='20' y='28' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='24' fill='white'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header>
  <div class="logo">
    <div class="logo-mark">C</div>
    <div>
      <div class="logo-name">CodeCade</div>
      <div class="logo-sub">Script Portal</div>
    </div>
  </div>

  <div class="header-search">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
    <input id="search" type="text" placeholder="Search projects…" oninput="filterProjects(this.value)" autocomplete="off">
  </div>

  <div class="header-right">
    <a class="btn btn-broadcast" href="/cast" target="_blank" title="Open TemuTalk broadcast">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4 2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      Broadcast
    </a>
    <div class="stat-chip" id="running-chip">
      <div class="stat-dot"></div>
      <span id="running-label">0 running</span>
    </div>
    <div class="stat-chip">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="opacity:.5"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <span id="total-label">0 projects</span>
    </div>
  </div>
</header>

<!-- ── Layout ──────────────────────────────────────────────────────────────── -->
<div class="layout">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Categories</div>
      <button class="nav-btn active" data-cat="all" onclick="filterCat('all',this)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        All Projects
        <span class="nav-count" id="cnt-all">0</span>
      </button>
      <button class="nav-btn" data-cat="Web Apps" onclick="filterCat('Web Apps',this)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12z"/></svg>
        Web Apps
        <span class="nav-count" id="cnt-Web Apps">0</span>
      </button>
    </div>

    <div class="sidebar-bottom">
      <div class="sidebar-label">Quick actions</div>
      <button class="action-btn" onclick="stopAll()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
        Stop all
      </button>
    </div>
  </nav>

  <!-- Main content -->
  <main id="main">
    <div id="sections"></div>
    <div id="empty-state" style="display:none;">
      <div class="empty-icon">🔍</div>
      <div class="empty-text">No projects match your search</div>
    </div>
  </main>

</div>

<!-- ── Terminal panel ─────────────────────────────────────────────────────── -->
<div id="term-panel">
  <div class="term-header">
    <div class="term-dots">
      <div class="term-dot red"></div>
      <div class="term-dot yellow" id="term-min-btn" onclick="closeTerm()" title="Minimise"></div>
      <div class="term-dot green"></div>
    </div>
    <div class="term-title-bar">
      <span id="term-icon" style="font-size:14px;"></span>
      <span id="term-title">Output</span>
      <span id="term-pid" class="term-pid"></span>
    </div>
    <div class="term-actions">
      <button class="term-btn" id="term-scroll-btn" onclick="toggleAutoScroll()" title="Auto-scroll">↓</button>
      <button class="term-btn" onclick="clearTerm()">Clear</button>
      <button class="term-btn term-btn-close" onclick="closeTerm()">✕</button>
    </div>
  </div>
  <div id="term-out"></div>
</div>

<!-- ── Toast ──────────────────────────────────────────────────────────────── -->
<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let projects = [];
let activeId  = null;
let ws        = null;
let autoScroll = true;
let activeCat  = 'all';
let activeType = 'all';
let searchQ    = '';
const runningSet = new Set();

const THUMBS = {
  'temutalk':  '/thumbs/temutalk.svg',
  'git-forge': '/thumbs/git-forge.svg',
  'smart-home':'/thumbs/smart-home.svg',
};

const CAT_COLORS = {
  'Web Apps': { accent: '#b09ffc', glow: 'rgba(176,159,252,.18)' },
  'Python':   { accent: '#42c8ff', glow: 'rgba(66,200,255,.15)'  },
  'C / CUDA': { accent: '#ff9f4a', glow: 'rgba(255,159,74,.15)'  },
  'C#':       { accent: '#3ef5a8', glow: 'rgba(62,245,168,.15)'  },
};

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connectWS() {
  ws = new WebSocket(`wss://${location.host}`);
  ws.onopen = () => { if (activeId) subscribe(activeId); };
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'out')  appendTerm(msg.text);
      if (msg.type === 'exit') {
        runningSet.delete(activeId);
        appendTerm(`\n[exited${msg.code != null ? ' · code ' + msg.code : ''}]\n`, 'exit');
        refreshCard(activeId);
        updateStats();
      }
    } catch {}
  };
  ws.onclose = () => setTimeout(connectWS, 2000);
}
function subscribe(id) {
  if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({ type: 'subscribe', id }));
}

// ── API ───────────────────────────────────────────────────────────────────────
async function loadProjects() {
  projects = await fetch('/api/projects').then(r => r.json());
  projects.forEach(p => { if (p.running) runningSet.add(p.id); });
  updateCounts();
  render();
}

async function launch(id, e) {
  e && e.stopPropagation();
  const r = await fetch(`/api/launch/${id}`, { method: 'POST' }).then(r => r.json());
  if (r.error) return toast('⚠ ' + r.error, 'err');
  if (r.info)  return toast('Deploy the plugin to the IGTAP game folder to use it');
  runningSet.add(id);
  openTerm(id);
  refreshCard(id);
  updateStats();
  toast('Launched');
}

async function stop(id, e) {
  e && e.stopPropagation();
  await fetch(`/api/stop/${id}`, { method: 'POST' });
  runningSet.delete(id);
  if (activeId === id) appendTerm('\n[stopped]\n', 'exit');
  refreshCard(id);
  updateStats();
}

async function stopAll() {
  for (const id of [...runningSet]) await stop(id);
  toast('All stopped');
}

// ── Filtering ─────────────────────────────────────────────────────────────────
function filterCat(cat, btn) {
  activeCat = cat;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
}
function filterType(type, btn) {
  activeType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
}
function filterProjects(q) { searchQ = q.toLowerCase(); render(); }

function visible(p) {
  if (activeCat !== 'all' && p.cat !== activeCat) return false;
  if (activeType !== 'all' && p.type !== activeType) return false;
  if (searchQ && !p.name.toLowerCase().includes(searchQ) && !p.desc.toLowerCase().includes(searchQ)) return false;
  return true;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const cats = [...new Set(projects.map(p => p.cat))];
  const sections = document.getElementById('sections');
  const empty    = document.getElementById('empty-state');
  let anyVisible = false;

  sections.innerHTML = cats.map(cat => {
    const ps = projects.filter(p => p.cat === cat && visible(p));
    if (!ps.length) return '';
    anyVisible = true;
    const col = CAT_COLORS[cat] || { accent: '#b09ffc', glow: 'rgba(176,159,252,.15)' };
    return `
      <section class="cat-section" id="sec-${cat.replace(/[^a-z]/gi,'-')}">
        <div class="section-header">
          <div class="section-accent" style="background:${col.accent}"></div>
          <h2 class="section-title">${cat}</h2>
          <span class="section-count">${ps.length}</span>
        </div>
        <div class="cards">
          ${ps.map(p => cardHTML(p, col)).join('')}
        </div>
      </section>`;
  }).join('');

  empty.style.display = anyVisible ? 'none' : '';
}

function cardHTML(p, col) {
  const running  = runningSet.has(p.id);
  const selected = activeId === p.id;
  const thumb    = THUMBS[p.id] || '';
  const typeLabel = (p.type || 'info').toUpperCase();
  const badgeCls  = 'badge-' + (p.type || 'info');

  const openBtn = p.url ? `<a class="btn btn-open" href="${p.url}" target="_blank" onclick="event.stopPropagation()">
    Open <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
  </a>` : '';
  let actions = '';
  if (p.type === 'info') {
    actions = `<div class="card-info-note">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      Deploy to game folder to use
    </div>`;
  } else if (p.type === 'web') {
    actions = `${running ? `<button class="btn btn-stop" onclick="stop('${p.id}',event)">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg> Stop
      </button>` : `<button class="btn btn-launch" onclick="launch('${p.id}',event)">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Start
      </button>`}
      ${openBtn}`;
  } else if (running) {
    actions = `
      <button class="btn btn-stop" onclick="stop('${p.id}',event)">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg> Stop
      </button>
      <button class="btn btn-logs" onclick="openTerm('${p.id}');event.stopPropagation()">Logs</button>`;
  } else {
    actions = `<button class="btn btn-launch" onclick="launch('${p.id}',event)">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Launch
    </button>`;
  }

  return `
  <div class="card${running?' running':''}${selected?' selected':''}"
       id="card-${p.id}" onclick="selectCard('${p.id}')"
       style="${running ? `--card-glow:${col.glow};--card-border:${col.accent}40` : ''}">
    <div class="card-thumb" style="${thumb ? `background-image:url(${thumb})` : `background:${col.glow}`}">
      ${running ? '<div class="card-running-bar"></div>' : ''}
    </div>
    <div class="card-body">
      <div class="card-row1">
        <span class="badge ${badgeCls}">${typeLabel}</span>
        <div class="status-pill ${running?'on':''}">
          <div class="status-dot ${running?'on':''}"></div>
          ${running ? 'Running' : 'Idle'}
        </div>
      </div>
      <div class="card-name">${p.name}</div>
      <div class="card-desc">${p.desc}</div>
      <div class="card-actions">${actions}</div>
    </div>
  </div>`;
}

function refreshCard(id) {
  const p   = projects.find(x => x.id === id);
  const el  = document.getElementById(`card-${id}`);
  if (!p || !el) return;
  const col = CAT_COLORS[p.cat] || { accent: '#b09ffc', glow: 'rgba(176,159,252,.15)' };
  el.outerHTML = cardHTML(p, col);
}

function updateCounts() {
  const cats = ['Web Apps','Python','C / CUDA','C#'];
  document.getElementById('cnt-all').textContent = projects.length;
  cats.forEach(cat => {
    const el = document.getElementById(`cnt-${cat}`);
    if (el) el.textContent = projects.filter(p => p.cat === cat).length;
  });
}

function updateStats() {
  const n = runningSet.size;
  const lbl = document.getElementById('running-label');
  const chip = document.getElementById('running-chip');
  lbl.textContent = n === 0 ? '0 running' : n === 1 ? '1 running' : `${n} running`;
  chip.classList.toggle('has-running', n > 0);
  document.getElementById('total-label').textContent = `${projects.length} projects`;
}

// ── Terminal ──────────────────────────────────────────────────────────────────
function openTerm(id) {
  const p = projects.find(x => x.id === id);
  activeId = id;
  document.getElementById('term-icon').textContent  = '';
  document.getElementById('term-title').textContent = p ? p.name : id;
  document.getElementById('term-pid').textContent   = '';
  if (!document.getElementById('term-panel').classList.contains('open')) {
    document.getElementById('term-out').innerHTML = '';
  }
  document.getElementById('term-panel').classList.add('open');
  document.body.classList.add('term-open');
  subscribe(id);
  fetch(`/api/output/${id}`).then(r => r.json()).then(d => {
    if (d.lines.length) {
      document.getElementById('term-out').innerHTML = '';
      appendTerm(d.lines.join('\n') + '\n');
    }
  });
  // Mark selected
  document.querySelectorAll('.card').forEach(el => el.classList.remove('selected'));
  const card = document.getElementById(`card-${id}`);
  if (card) card.classList.add('selected');
}

function closeTerm() {
  document.getElementById('term-panel').classList.remove('open');
  document.body.classList.remove('term-open');
  document.querySelectorAll('.card').forEach(el => el.classList.remove('selected'));
  activeId = null;
}

function clearTerm() { document.getElementById('term-out').innerHTML = ''; }

function selectCard(id) {
  if (activeId === id && document.getElementById('term-panel').classList.contains('open')) {
    closeTerm(); return;
  }
  openTerm(id);
}

function appendTerm(text, cls) {
  const out  = document.getElementById('term-out');
  const span = document.createElement('span');
  if (cls) span.className = 'term-' + cls;
  span.textContent = text;
  out.appendChild(span);
  if (autoScroll) out.scrollTop = out.scrollHeight;
}

function toggleAutoScroll() {
  autoScroll = !autoScroll;
  const btn = document.getElementById('term-scroll-btn');
  btn.classList.toggle('active', autoScroll);
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let _toastTimer;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type ? ' ' + type : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.className = '', 2600);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
connectWS();
loadProjects().then(updateStats);
// Refresh running states every 5s to pick up auto-started processes
setInterval(async () => {
  const fresh = await fetch('/api/projects').then(r => r.json());
  let changed = false;
  fresh.forEach(p => {
    const wasRunning = runningSet.has(p.id);
    if (p.running && !wasRunning) { runningSet.add(p.id); changed = true; }
    if (!p.running && wasRunning) { runningSet.delete(p.id); changed = true; }
  });
  if (changed) { render(); updateStats(); }
}, 5000);
</script>
</body>
</html>
